<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Jin Zhi</title>
<script>
  var l = window.location;
  var path = l.pathname;
  if (path.length > 1 && !path.endsWith('/') && !/\.[a-zA-Z0-9]+$/.test(path)) {
    l.replace(l.protocol + '//' + l.host + path + '/' + l.search + l.hash);
  } else {
    l.replace(l.protocol + '//' + l.host + '/' + l.search + l.hash);
  }
</script>
</head>
<body></body>
</html>
